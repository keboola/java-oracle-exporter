name: Publish jar to S3
on:
  workflow_dispatch: {}
  push:
    tags:
      - '*'
permissions:
  id-token: write
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Build jar
        run: mvn -B -DskipTests clean package
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::061240556736:role/kbc-gha-rw-role-java-oracle-exporter
          aws-region: us-east-1
      - name: Upload jar to S3
        run: aws s3 cp target/*-jar-with-dependencies.jar s3://keboola-drivers/oracle-table-exporter/
